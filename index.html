<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магическое слово — предсказание дня</title>
<meta name="description" content="Нажми кнопку и узнай своё предсказание из 50 карт про автозапчасти и трудолюбивых сотрудников.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage">
  <p class="lead">нажми кнопку — узнаешь своё предсказание</p>

  <section class="paper" id="paper">
    <p class="num" id="num">предсказание дня</p>
    <p class="text" id="text">Здесь появится твоё предсказание. Нажимай на кнопку — и узнаешь, что ждёт тебя завтра.</p>
  </section>

  <button class="draw" id="draw" type="button">Узнать предсказание</button>

  <p class="toast" id="toast" role="status"></p>
</main>

<noscript>
  <div class="noscript">Для рандомайзера нужен включённый JavaScript.</div>
</noscript>

<script src="predictions.js"></script>
<script src="app.js" defer></script>
</body>
</html>
