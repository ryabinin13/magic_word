<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магическое слово — предсказание дня</title>
<meta name="description" content="Нажми кнопку и узнай своё предсказание из 50 карт про автозапчасти и трудолюбивых сотрудников.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <defs>
    <g id="g-figure">
      <path d="M30 37v22"/>
      <path d="M30 59l-8 22"/><path d="M30 59l10 22"/>
      <path d="M22 81h-7"/><path d="M40 81h7"/>
    </g>
    <g id="g-head">
      <circle cx="30" cy="24" r="13"/>
    </g>
    <g id="g-face">
      <circle class="fill" cx="25" cy="25" r="1.8"/>
      <circle class="fill" cx="35" cy="25" r="1.8"/>
      <path d="M26 31q4 4 8 0"/>
    </g>
  </defs>

  <symbol id="w-cap" viewBox="0 0 60 90">
    <use href="#g-head"/><use href="#g-figure"/><use href="#g-face"/>
    <path d="M17 20a13 13 0 0 1 26 0"/>
    <path d="M41 20h12"/>
  </symbol>

  <symbol id="w-vest" viewBox="0 0 60 90">
    <use href="#g-head"/><use href="#g-figure"/><use href="#g-face"/>
    <path d="M19 19q11-11 22 0"/>
    <path d="M22 40l8-4 8 4-2 19H24z"/>
    <path d="M22 49h16"/>
    <path d="M22 43l-12 12"/><path d="M38 43l12 10"/>
  </symbol>

  <symbol id="w-tool" viewBox="0 0 60 90">
    <use href="#g-head"/><use href="#g-figure"/><use href="#g-face"/>
    <path d="M19 19q11-11 22 0"/>
    <path d="M30 43l-13 12"/>
    <path d="M30 43l12-7"/>
    <path d="M42 36l10-9"/>
    <rect x="49" y="20" width="6" height="13" rx="2.5" transform="rotate(42 52 26)"/>
  </symbol>

  <symbol id="w-box" viewBox="0 0 60 90">
    <use href="#g-head"/><use href="#g-figure"/><use href="#g-face"/>
    <path d="M19 19q11-11 22 0"/>
    <path d="M30 43l-11 10"/><path d="M30 43l11 10"/>
    <rect x="16" y="52" width="28" height="19"/>
    <path d="M16 61h28"/><path d="M30 52v19"/>
    <path d="M24 71l-5 12"/><path d="M36 71l6 12"/>
  </symbol>

  <symbol id="p-gear" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="18"/>
    <circle cx="32" cy="32" r="6"/>
    <circle cx="32" cy="8" r="7"/><circle cx="49" cy="15" r="7"/>
    <circle cx="56" cy="32" r="7"/><circle cx="49" cy="49" r="7"/>
    <circle cx="32" cy="56" r="7"/><circle cx="15" cy="49" r="7"/>
    <circle cx="8" cy="32" r="7"/><circle cx="15" cy="15" r="7"/>
  </symbol>

  <symbol id="p-wrench" viewBox="0 0 40 96">
    <circle cx="20" cy="84" r="9"/>
    <path d="M20 75V34"/>
    <path d="M14 34v-12a6 6 0 0 1 12 0v12"/>
    <path d="M14 22l3.5-5.5"/><path d="M26 22l-3.5-5.5"/>
  </symbol>

  <symbol id="p-tire" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="28"/>
    <circle cx="32" cy="32" r="14"/>
    <path d="M50 32h6"/><path d="M44.7 19.3L49 15"/><path d="M32 14V8"/>
    <path d="M19.3 19.3L15 15"/><path d="M14 32H8"/>
    <path d="M19.3 44.7L15 49"/><path d="M32 50v6"/><path d="M44.7 44.7L49 49"/>
    <circle class="fill" cx="32" cy="23" r="1.7"/><circle class="fill" cx="41" cy="32" r="1.7"/>
    <circle class="fill" cx="32" cy="41" r="1.7"/><circle class="fill" cx="23" cy="32" r="1.7"/>
  </symbol>

  <symbol id="p-piston" viewBox="0 0 56 74">
    <rect x="8" y="8" width="40" height="14" rx="3"/>
    <path d="M20 22v28"/><path d="M36 22v28"/>
    <path d="M20 30h16"/><path d="M20 38h16"/>
    <circle cx="28" cy="46" r="4"/>
    <path d="M28 50v6"/>
    <circle cx="28" cy="64" r="7"/>
  </symbol>

  <symbol id="p-can" viewBox="0 0 68 56">
    <rect x="12" y="22" width="34" height="26" rx="3"/>
    <path d="M22 22v-8h12"/>
    <path d="M45 30l10-12 5 4-10 12z"/>
    <path d="M20 34h18"/>
  </symbol>

  <symbol id="p-crate" viewBox="0 0 96 60">
    <rect x="6" y="8" width="84" height="42" rx="2"/>
    <path d="M6 17h84"/>
    <text class="fill" x="48" y="37" text-anchor="middle" font-size="16">ЗАПЧАСТИ</text>
  </symbol>

  <symbol id="p-bolt" viewBox="0 0 56 32">
    <path d="M6 6h14l9 10-9 10H6z"/>
    <path d="M29 16h21"/>
    <path d="M34 10v12"/><path d="M40 10v12"/><path d="M46 10v12"/>
  </symbol>
</svg>

<div class="bg" aria-hidden="true">
  <div class="bg-inner">
    <div class="bg-top"></div>
    <div class="bg-bottom"></div>
    <svg class="squiggle" viewBox="0 0 200 40" preserveAspectRatio="none" focusable="false">
      <path d="M0 20q12.5-16 25 0t25 0 25 0 25 0 25 0 25 0 25 0 25 0"/>
    </svg>
  </div>
</div>

<div class="deco-layer" id="deco" aria-hidden="true"></div>

<div class="walkers" aria-hidden="true">
  <svg class="walker walker-a" viewBox="0 0 60 90" focusable="false"><use href="#w-vest"/></svg>
  <svg class="walker walker-b" viewBox="0 0 60 90" focusable="false"><use href="#w-cap"/></svg>
</div>

<main class="stage">
  <header class="title">
    <p>нажми кнопку — узнаешь своё предсказание</p>
  </header>

  <section class="paper" id="paper">
    <svg class="pin" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M16 4H9a4 4 0 0 0-4 4v9a3 3 0 0 0 6 0V7a1.5 1.5 0 0 0-3 0v9.5"/>
    </svg>
    <p class="num" id="num">предсказание дня</p>
    <p class="text" id="text">Здесь появится твоё предсказание. Нажимай на кнопку — и узнаешь, что ждёт тебя завтра.</p>
  </section>

  <button class="draw" id="draw" type="button">Узнать предсказание</button>

  <p class="toast" id="toast" role="status"></p>
</main>

<p class="hint" id="hint">предсказания взяты из <code>a.txt</code></p>

<noscript>
  <div class="noscript">Для рандомайзера нужен включённый JavaScript.</div>
</noscript>

<script src="predictions.js"></script>
<script src="app.js" defer></script>
</body>
</html>
