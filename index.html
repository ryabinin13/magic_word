<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магическое слово — предсказание дня</title>
<meta name="description" content="Нажми кнопку и узнай своё предсказание из 50 карт про автозапчасти и трудолюбивых сотрудников.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="poster">
  <!-- Макет из Photoshop (предсказания.psd), 1890×1418. В нём по центру светлая
       панель 716×243 (x587..1303, y461..704), а внутри неё — текстовое поле
       648×189 (x621..1269, y488..677). Сюда встаёт живой контент. -->
  <img class="art" src="assets/design.png" alt="" width="1890" height="1418" aria-hidden="true">

  <main class="card">
    <p class="num" id="num">предсказание дня</p>
    <p class="text" id="text">Здесь появится твоё предсказание. Нажимай на кнопку — и узнаешь, что ждёт тебя завтра.</p>
    <div class="actions">
      <button class="draw" id="draw" type="button">Узнать предсказание</button>
      <p class="toast" id="toast" role="status"></p>
    </div>
  </main>
</div>

<noscript>
  <div class="noscript">Для рандомайзера нужен включённый JavaScript.</div>
</noscript>

<script src="predictions.js"></script>
<script src="app.js" defer></script>
</body>
</html>
