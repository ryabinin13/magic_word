<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магическое слово — предсказание дня</title>
<meta name="description" content="Нажми кнопку и получи единственное предсказание из 50 карт про автозапчасти и трудолюбивых сотрудников — с мотанием и финалом.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="poster">
  <!-- Макет из Photoshop (предсказания.psd), 1890×1418. В нём по центру светлая
       панель 716×243 (x587..1303, y461..704), а внутри неё — текстовое поле
       648×189 (x621..1269, y488..677). Сюда встаёт живой контент.
       Для телефона (портрет) — отдельный вертикальный макет 898×1418 из
       папки phone/: панель 716×243 при (91, 461), поле 648×189 при (125, 488),
       центр тот же (50%, 41.079%). -->
  <picture>
    <source media="(max-width: 959px) and (orientation: portrait)" srcset="assets/design-phone.png">
    <img class="art" src="assets/design.png" alt="" width="1890" height="1418" aria-hidden="true">
  </picture>

  <main class="card">
    <p class="text" id="text">Здесь появится твоё предсказание. Нажимай на кнопку — и узнаешь, что ждёт тебя через год.</p>
    <div class="actions">
      <button class="draw" id="draw" type="button">Узнать предсказание</button>
    </div>
  </main>
</div>

<noscript>
  <div class="noscript">Для рандомайзера нужен включённый JavaScript.</div>
</noscript>

<script src="predictions.js"></script>
<script src="app.js" defer></script>
</body>
</html>
